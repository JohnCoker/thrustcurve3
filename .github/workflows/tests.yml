name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Steps read env. runs-on and services cannot, so the runner and MongoDB service are anchors.
env:
  NODE_VERSION: "26"
  UBUNTU_CODENAME: noble
  # MongoDB 7.0.35, same release as local and Atlas.
  # The service image is the same release; services cannot read env.
  MONGO_VERSION: "7.0.35"
  # 7.0 has no Ubuntu 24.04 binary. The 22.04 build uses OpenSSL 3.
  MONGOMS_DISTRO: ubuntu-22.04
  # mongosh and mongorestore package repo.
  MONGO_TOOLS_VERSION: "8.0"

jobs:
  unit:
    name: Unit tests
    runs-on: &runner ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ env.MONGO_VERSION }}-${{ hashFiles('package-lock.json') }}

      # In-memory mongod version for this job. Local runs use package.json config.mongodbMemoryServer.version.
      - name: Select MongoDB version for the in-memory server
        run: echo "MONGOMS_VERSION=$MONGO_VERSION" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run test:lib

  api:
    name: API tests
    runs-on: *runner
    timeout-minutes: 20
    env:
      EXTRA_PACKAGES: libxml2-utils
    services: &mongodb
      mongodb:
        image: mongo:7.0.35
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install MongoDB client tools
        run: &install-mongo-tools |
          curl -fsSL "https://www.mongodb.org/static/pgp/server-${MONGO_TOOLS_VERSION}.asc" | sudo gpg -o "/usr/share/keyrings/mongodb-server-${MONGO_TOOLS_VERSION}.gpg" --dearmor
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-${MONGO_TOOLS_VERSION}.gpg ] https://repo.mongodb.org/apt/ubuntu ${UBUNTU_CODENAME}/mongodb-org/${MONGO_TOOLS_VERSION} multiverse" | sudo tee "/etc/apt/sources.list.d/mongodb-org-${MONGO_TOOLS_VERSION}.list"
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh mongodb-database-tools $EXTRA_PACKAGES

      - run: npm ci
      - run: sh .github/scripts/with-test-server.sh npm run test:api

  browser:
    name: Browser tests
    runs-on: *runner
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    services: *mongodb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install MongoDB client tools
        run: *install-mongo-tools

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - run: sh .github/scripts/with-test-server.sh npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            tmp/www-test.log
          retention-days: 7
          if-no-files-found: ignore
